<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Космический Альянс</title>
    <link rel="stylesheet" href="style.css">
    <script>
    if (typeof YaGames === 'undefined') {
        window.YaGames = { init: () => Promise.resolve({ environment: { i18n: { lang: 'ru' } }, features: { LoadingAPI: { ready: () => {} }, GameplayAPI: { start: () => {}, stop: () => {} } }, getPlayer: () => Promise.resolve({ getName: () => 'Player', getPhoto: () => '', isAuthorized: () => false }), getLeaderboards: () => Promise.resolve({ setLeaderboardScore: () => Promise.resolve() }), adv: { showRewardedVideo: (cb) => { if(cb && cb.callbacks) cb.callbacks.onClose(); }, showFullscreenAdv: (cb) => { if(cb && cb.callbacks) cb.callbacks.onClose(true); } }, isAvailableMethod: () => Promise.resolve(false) }) };
        YaGames.init().then(sdk => { window.ysdk = sdk; });
    }
    </script>
    <script>
    var phaserReady = new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js', true);
        xhr.onload = function() { if (xhr.status === 200) { eval(xhr.responseText); resolve(); } else { reject('Phaser load failed'); } };
        xhr.onerror = function() { reject('Phaser network error'); };
        xhr.send();
    });
    </script>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="game-container"></div>
    <script>phaserReady.then(function() { var s = document.createElement('script'); s.src = 'game.js'; document.body.appendChild(s); });</script>
</body>
</html>
