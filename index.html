<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Космический Альянс</title>
    <link rel="stylesheet" href="style.css">
    
    <script>
// Fallback: if Yandex SDK not available (local/GitHub Pages), mock it
if (typeof YaGames === 'undefined') {
    console.log('Yandex SDK not available \u2014 using mock');
    window.YaGames = {
        init: () => Promise.resolve({
            environment: { i18n: { lang: 'ru' } },
            features: { 
                LoadingAPI: { ready: () => {} },
                GameplayAPI: { start: () => {}, stop: () => {} }
            },
            getPlayer: () => Promise.resolve({ 
                getName: () => 'Player',
                getPhoto: () => '',
                isAuthorized: () => false
            }),
            getLeaderboards: () => Promise.resolve({
                setLeaderboardScore: () => Promise.resolve(),
                getLeaderboardDescription: () => Promise.resolve({ leaderboard: { name: 'main' } })
            }),
            adv: {
                showRewardedVideo: (cb) => { if(cb && cb.callbacks) cb.callbacks.onClose?.(); },
                showFullscreenAdv: (cb) => { if(cb && cb.callbacks) cb.callbacks.onClose?.(true); }
            },
            isAvailableMethod: () => Promise.resolve(false)
        })
    };
    YaGames.init().then(sdk => { window.ysdk = sdk; });
}
</script>
    <!-- Yandex Games SDK -->
    <script src="https://yandex.ru/games/sdk/v2/sdk.js"></script>
    
    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="game-container"></div>
    
    <!-- Game script -->
    <script src="game.js"></script>
</body>
</html>
