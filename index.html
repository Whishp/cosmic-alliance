<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Космический Альянс</title>
    <link rel="stylesheet" href="style.css">
    <script>
    // Yandex Games SDK fallback for non-Yandex environment (GitHub Pages etc.)
    if (typeof YaGames === 'undefined') {
        window.YaGames = {
            init: () => Promise.resolve({
                environment: { i18n: { lang: 'ru' } },
                features: { LoadingAPI: { ready: () => {} }, GameplayAPI: { start: () => {}, stop: () => {} } },
                getPlayer: () => Promise.resolve({ getName: () => 'Player', getPhoto: () => '', isAuthorized: () => false }),
                getLeaderboards: () => Promise.resolve({ setLeaderboardScore: () => Promise.resolve() }),
                adv: {
                    showRewardedVideo: (cb) => { if(cb && cb.callbacks) cb.callbacks.onClose(); },
                    showFullscreenAdv: (cb) => { if(cb && cb.callbacks) cb.callbacks.onClose(true); }
                },
                isAvailableMethod: () => Promise.resolve(false)
            })
        };
        YaGames.init().then(sdk => { window.ysdk = sdk; });
    }
    </script>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="game-container"></div>
    <script type="module">
    // Load Phaser via ESM import — avoids UMD `this` binding issue on GitHub Pages
    import('https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.esm.js').then(mod => {
        window.Phaser = mod.Phaser || mod.default;
        const s = document.createElement('script');
        s.src = 'game.js';
        document.body.appendChild(s);
    }).catch(e => {
        console.error('Failed to load Phaser:', e);
        document.getElementById('game-container').innerHTML = '<p style="color:#fff;text-align:center;padding:2em">Ошибка загрузки Phaser. Пожалуйста, обновите страницу.</p>';
    });
    </script>
</body>
</html>
