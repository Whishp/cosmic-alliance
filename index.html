<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>КОСМИЧЕСКИЙ АЛЬЯНС | COSMIC ALLIANCE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #050510; overflow: hidden; }
        #game-container { width: 100%; height: 100%; }
        /* Loading screen */
        #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #050510; color: #00E5FF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; z-index: 9999; transition: opacity 0.5s; }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading h1 { font-size: 24px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 24px; }
        .loader { width: 40px; height: 40px; border: 3px solid rgba(0,229,255,0.15); border-top: 3px solid #00E5FF; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <h1>COSMIC ALLIANCE</h1>
        <div class="loader"></div>
    </div>
    <div id="game-container"></div>
    <!-- Phaser + game loaded via async loader -->
    <script src="phaser-loader.js"></script>
    <script>
        // Hide loading screen once Phaser game starts
        var checkGame = setInterval(function() {
            if (typeof Phaser !== 'undefined' && document.querySelector('canvas')) {
                document.getElementById('loading').classList.add('hidden');
                clearInterval(checkGame);
            }
        }, 200);
    </script>
</body>
</html>
