<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050510">
<title>Космический Альянс</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #050510; --surface: rgba(22, 22, 46, 0.85);
    --accent: #00E5FF; --accent2: #BF5AF2; --gold: #FFD60A;
    --text: #FFFFFF; --text2: rgba(235, 235, 245, 0.55);
    --glass: rgba(120, 120, 128, 0.10);
    --cell-bg: rgba(30, 30, 60, 0.6);
    --cell-border: rgba(0, 229, 255, 0.15);
  }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; overflow: hidden; }

  /* Background space circles */
  #bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .orbit { position: absolute; border-radius: 50%; border: 1px solid rgba(0, 229, 255, 0.08); }

  /* Desktop Nav */
  #desktop-nav { display: none; padding: 16px 32px; gap: 8px; border-bottom: 0.5px solid rgba(255,255,255,0.06); }
  .nav-btn { padding: 10px 24px; border-radius: 10px; background: transparent; border: none; color: var(--text2); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .nav-btn.active { background: var(--accent); color: white; }

  /* Status Bar */
  #status-bar { height: env(safe-area-inset-top, 44px); min-height: 44px; display: flex; align-items: center; justify-content: center; padding: 0 24px; font-size: 15px; font-weight: 700; position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(5,5,16,0.4); backdrop-filter: blur(20px); letter-spacing: 2px; }

  /* App */
  #app { height: 100vh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 44px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); position: relative; z-index: 1; }

  /* HUD */
  #hud { display: flex; justify-content: center; gap: 16px; padding: 12px 16px; }
  .hud-pill { background: var(--glass); border-radius: 20px; padding: 8px 16px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; border: 0.5px solid rgba(255,255,255,0.06); }
  .hud-pill.gold { color: var(--gold); }
  .hud-pill.cyan { color: var(--accent); }
  .hud-pill.muted { color: var(--text2); }

  /* Game Board */
  #board-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 16px; gap: 16px; }
  #board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 360px; aspect-ratio: 1; }
  .cell { background: var(--cell-bg); border-radius: 14px; border: 1px solid var(--cell-border); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; cursor: pointer; position: relative; transition: all 0.15s; aspect-ratio: 1; }
  .cell.empty { border-color: rgba(0, 229, 255, 0.06); background: rgba(30, 30, 60, 0.25); }
  .cell:hover { border-color: rgba(0, 229, 255, 0.4); }
  .cell.selected { border-color: var(--accent); box-shadow: 0 0 20px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0, 229, 255, 0.1); }
  .cell.merged { animation: mergePop 0.3s ease-out; }
  .cell .tier-label { position: absolute; bottom: 2px; font-size: 9px; color: var(--text2); font-weight: 500; }

  @keyframes mergePop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } }

  .float-text { position: absolute; font-size: 20px; font-weight: 800; color: var(--gold); pointer-events: none; animation: floatUp 0.7s ease-out forwards; z-index: 50; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }

  /* Buttons */
  #action-row { display: flex; gap: 10px; width: 100%; max-width: 360px; padding: 0 16px; }
  .action-btn { flex: 1; height: 44px; border-radius: 12px; border: none; color: white; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: transform 0.1s; }
  .action-btn:active { transform: scale(0.95); }
  #btn-ad { background: linear-gradient(135deg, var(--accent), #0088cc); box-shadow: 0 4px 16px rgba(0, 229, 255, 0.2); }
  #btn-daily { background: linear-gradient(135deg, var(--accent2), #7B2CBF); box-shadow: 0 4px 16px rgba(191, 90, 242, 0.2); }
  #btn-prestige { background: linear-gradient(135deg, #FF375F, #FF9F0A); box-shadow: 0 4px 16px rgba(255, 55, 95, 0.2); }

  /* Multipliers */
  #mult-row { display: flex; justify-content: center; gap: 8px; }
  .mult-btn { min-width: 48px; height: 32px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: var(--text2); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; padding: 0 12px; }
  .mult-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* Tab Bar */
  #tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: calc(72px + env(safe-area-inset-bottom, 0px)); background: rgba(10,10,24,0.92); border-top: 0.5px solid rgba(0, 229, 255, 0.08); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; z-index: 100; backdrop-filter: blur(20px); }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 16px; color: var(--text2); font-size: 10px; font-weight: 500; cursor: pointer; }
  .tab-item.active { color: var(--accent); }
  .tab-icon { font-size: 24px; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(5,5,16,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(10px); }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border-radius: 24px; width: 85%; max-width: 380px; padding: 28px; text-align: center; border: 1px solid rgba(0, 229, 255, 0.2); box-shadow: 0 0 40px rgba(0, 229, 255, 0.15), 0 20px 60px rgba(0,0,0,0.5); }
  .modal-title { font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
  .modal-text { font-size: 15px; color: var(--text2); margin-bottom: 8px; line-height: 1.5; text-align: left; }
  .modal-btn { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; }
  .modal-btn:hover { background: var(--accent); color: var(--bg); }

  /* Desktop */
  @media (min-width: 900px) {
    body { display: flex; flex-direction: column; align-items: center; }
    #status-bar { display: none; }
    #desktop-nav { display: flex; width: 100%; max-width: 1000px; }
    #app { max-width: 1000px; width: 100%; height: calc(100vh - 60px); padding-bottom: 0; }
    #board { max-width: 480px; gap: 10px; }
    .cell { font-size: 28px; border-radius: 16px; }
    #tab-bar { display: none; }
  }
</style>
</head>
<body>

<div id="bg-layer"></div>

<div id="desktop-nav">
  <button class="nav-btn active">🎮 Игра</button>
  <button class="nav-btn">🏆 Рекорды</button>
  <button class="nav-btn">⚡ Апгрейды</button>
</div>

<div id="status-bar">КОСМИЧЕСКИЙ АЛЬЯНС</div>

<div id="app">
  <div id="hud">
    <div class="hud-pill gold">🏆 СЧЁТ: <span id="score">0</span></div>
    <div class="hud-pill cyan">✨ СЛИЯНИЯ: <span id="merges">0</span></div>
    <div class="hud-pill muted">⭐ РЕКОРД: <span id="highscore">0</span></div>
  </div>

  <div id="board-area">
    <div id="board"></div>
    <div id="mult-row">
      <button class="mult-btn active" data-mult="1">x1</button>
      <button class="mult-btn" data-mult="10">x10</button>
      <button class="mult-btn" data-mult="100">x100</button>
    </div>
    <div id="action-row">
      <button class="action-btn" id="btn-ad">📺 Реклама 2x</button>
      <button class="action-btn" id="btn-daily">🎁 Ежедневный</button>
      <button class="action-btn" id="btn-prestige">✦ Престиж</button>
    </div>
  </div>
</div>

<div id="tab-bar">
  <div class="tab-item active"><div class="tab-icon">🎮</div>Игра</div>
  <div class="tab-item"><div class="tab-icon">🏆</div>Рекорды</div>
  <div class="tab-item"><div class="tab-icon">⚡</div>Апгрейды</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">КАК ИГРАТЬ</div>
    <div class="modal-text">
1. Нажмите на фишку, чтобы выбрать<br>
2. Нажмите на такую же фишку для слияния<br>
3. Объединяйте для получения большего числа очков<br>
4. Нажмите на пустую клетку для перемещения
    </div>
    <button class="modal-btn" id="modal-btn">ПОНЯТНО</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

// ========== GAME LOGIC ==========
const BOARD_SIZE = 5;
const TIERS = ['🌑','🌒','🌓','🌔','🌕','☀️','⭐','🌟','💫','✨','🔥','💎','👑','🪐','🌌','🌀'];
const COLORS = ['#444','#666','#888','#aaa','#FFD60A','#FF9F0A','#FF375F','#BF5AF2','#7B2CBF','#0A84FF','#5AC8FA','#30D158','#FF453A','#FFD60A','#BF5AF2','#0A84FF'];

let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
let selected = null;
let score = 0, merges = 0, highscore = 0;
let prestigeLevel = 0;
let adMultiplier = 1;

function loadGame() {
  const s = localStorage.getItem('alliance_save');
  if (s) {
    const d = JSON.parse(s);
    board = d.board || board;
    score = d.score || 0;
    merges = d.merges || 0;
    highscore = d.highscore || 0;
    prestigeLevel = d.prestigeLevel || 0;
  }
}

function saveGame() {
  localStorage.setItem('alliance_save', JSON.stringify({ board, score, merges, highscore, prestigeLevel }));
}

function getTier() { return Math.floor(Math.random() * Math.min(3 + prestigeLevel, TIERS.length)); }

function initBoard() {
  board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      if (Math.random() < 0.7) board[r][c] = getTier();
    }
  }
  renderBoard();
  updateHUD();
  saveGame();
}

function renderBoard() {
  const el = document.getElementById('board');
  if (!el) return;
  el.innerHTML = '';
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      const cell = document.createElement('div');
      const tier = board[r][c];
      const isSelected = selected && selected.r === r && selected.c === c;
      cell.className = 'cell' + (tier === null ? ' empty' : '') + (isSelected ? ' selected' : '');
      if (tier !== null) {
        cell.style.borderColor = COLORS[tier] + '40';
        cell.style.boxShadow = `0 0 15px ${COLORS[tier]}20, inset 0 0 20px ${COLORS[tier]}10`;
        cell.innerHTML = `${TIERS[tier]}<span class="tier-label">T${tier+1}</span>`;
      }
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('pointerdown', () => handleCell(r, c));
      el.appendChild(cell);
    }
  }
}

function handleCell(r, c) {
  const tier = board[r][c];

  // Select piece
  if (tier !== null && !selected) {
    selected = { r, c };
    renderBoard();
    return;
  }

  // Deselect
  if (selected && selected.r === r && selected.c === c) {
    selected = null;
    renderBoard();
    return;
  }

  // Merge
  if (selected && tier !== null && board[selected.r][selected.c] === tier) {
    board[r][c] = Math.min(tier + 1, TIERS.length - 1);
    board[selected.r][selected.c] = null;
    const points = (tier + 1) * 10 * adMultiplier * (1 + prestigeLevel * 0.5);
    score += points;
    merges++;
    if (score > highscore) highscore = score;
    showFloat(r, c, '+' + Math.floor(points));
    selected = null;
    adMultiplier = 1;
    saveGame();
    renderBoard();
    updateHUD();
    return;
  }

  // Move to empty
  if (selected && tier === null) {
    board[r][c] = board[selected.r][selected.c];
    board[selected.r][selected.c] = null;
    selected = null;
    saveGame();
    renderBoard();
    return;
  }

  // Select different piece
  if (tier !== null) {
    selected = { r, c };
    renderBoard();
  }
}

function showFloat(r, c, text) {
  const cells = document.querySelectorAll('.cell');
  const idx = r * BOARD_SIZE + c;
  const cell = cells[idx];
  if (!cell) return;
  const rect = cell.getBoundingClientRect();
  const ft = document.createElement('div');
  ft.className = 'float-text';
  ft.textContent = text;
  ft.style.left = (rect.left + rect.width/2) + 'px';
  ft.style.top = rect.top + 'px';
  ft.style.transform = 'translateX(-50%)';
  document.body.appendChild(ft);
  setTimeout(() => ft.remove(), 700);
}

function updateHUD() {
  const scoreEl = document.getElementById('score');
  const mergesEl = document.getElementById('merges');
  const highEl = document.getElementById('highscore');
  if (scoreEl) scoreEl.textContent = format(score);
  if (mergesEl) mergesEl.textContent = merges;
  if (highEl) highEl.textContent = format(highscore);
}

function format(n) {
  if (n >= 1e12) return (n/1e12).toFixed(1) + 'T';
  if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Math.floor(n).toString();
}

// ========== UI ==========
function showModal(title, text, btn) {
  const mo = document.getElementById('modal');
  const mt = document.getElementById('modal-title');
  const mc = document.getElementById('modal-text');
  const mb = document.getElementById('modal-btn');
  if (mt) mt.textContent = title;
  if (mc) mc.innerHTML = text;
  if (mb) mb.textContent = btn;
  if (mo) mo.classList.add('show');
}

function hideModal() { 
  const mo = document.getElementById('modal');
  if (mo) mo.classList.remove('show'); 
}

const modalBtn = document.getElementById('modal-btn');
if (modalBtn) modalBtn.addEventListener('click', hideModal);

// Tutorial on first play
if (!localStorage.getItem('alliance_tutorial')) {
  localStorage.setItem('alliance_tutorial', '1');
  setTimeout(() => showModal('КАК ИГРАТЬ', '1. Нажмите на фишку, чтобы выбрать<br>2. Нажмите на такую же фишку для слияния<br>3. Объединяйте для получения большего числа очков<br>4. Нажмите на пустую клетку для перемещения', 'ПОНЯТНО'), 500);
}

// Multipliers
document.querySelectorAll('.mult-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Action buttons
const btnAd = document.getElementById('btn-ad');
if (btnAd) btnAd.addEventListener('click', () => {
  adMultiplier = 2;
  showModal('РЕКЛАМА', 'Следующее слияние даёт x2 очков!', 'КРУТО');
});

const btnDaily = document.getElementById('btn-daily');
if (btnDaily) btnDaily.addEventListener('click', () => {
  showModal('ЕЖЕДНЕВНЫЙ ВЫЗОВ', 'Сделайте 10 слияний за 1 минуту!', 'ПОНЯТНО');
});

const btnPrestige = document.getElementById('btn-prestige');
if (btnPrestige) btnPrestige.addEventListener('click', () => {
  const req = 100 * Math.pow(10, prestigeLevel);
  if (score >= req) {
    if (confirm(`Сбросить прогресс ради x${prestigeLevel + 2} множителя?`)) {
      prestigeLevel++;
      score = 0; merges = 0;
      initBoard();
      showModal('ПРЕСТИЖ!', `Теперь доход x${(1 + prestigeLevel * 0.5).toFixed(1)}`, 'КРУТО');
    }
  } else {
    showModal('НЕДОСТАТОЧНО', `Нужно ${format(req)} очков`, 'ОК');
  }
});

// Background orbits
const bg = document.getElementById('bg-layer');
if (bg) {
  for (let i = 0; i < 6; i++) {
    const orb = document.createElement('div');
    orb.className = 'orbit';
    const size = 100 + Math.random() * 200;
    orb.style.width = size + 'px';
    orb.style.height = size + 'px';
    orb.style.left = (Math.random() * 100) + '%';
    orb.style.top = (Math.random() * 100) + '%';
    orb.style.transform = 'translate(-50%, -50%)';
    bg.appendChild(orb);
  }
}

// Init
loadGame();
if (board.flat().every(x => x === null)) {
  initBoard();
} else { 
  renderBoard(); 
  updateHUD(); 
}

}); // DOMContentLoaded
</script>
</html>
